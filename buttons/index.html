
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Button Styling</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Oswald:wght@400;700&family=Playfair+Display&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Button Styling</h1>
  <p>Five buttons inspired by different websites.</p>
  <h2>Starter Buttons</h2>
  <div class="buttons">
    <a href="https://www.spotify.com/" class="spotify">
      Spotify
    </a>

    <a href="https://www.twitter.com/" class="twitter">
      Twitter
    </a>

    <a href="https://www.indiegogo.com/" class="indiegogo">
      Indiegogo
    </a>

  </div>
  <h2>My Five Buttons</h2>
  <div class="buttons">
    <a href="https://www.coca-cola.com/" class="coca-cola">
      Coca-Cola
    </a>
    <a href="https://www.apple.com/" class="apple">
      Apple
    </a>
    <a href="https://nerf.hasbro.com/en-us" class="nerf">
      NERF!
    </a>
    <a href="https://www.harley-davidson.com/" class="harley">
      Harley-Davidson
    </a>
    <a href="https://www.missouribotanicalgarden.org/" class="garden">
      Missouri Botanical Garden
    </a>
  </div>

</body>
</html>
